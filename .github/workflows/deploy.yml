# Build the reviewed public-data showcase and deploy only its five-file static output.
# The full development cockpit includes data with unresolved redistribution
# and authority gates. This entry uses only the registered USGS and EIA public
# sources copied into public-demo/data and excludes the full app/public tree.
# The validator checks the exact output list, binary hashes, and blocked text.
name: Deploy Treasure Valley public-data showcase to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build public-only showcase
        run: npx vite build --config vite.public-demo.config.ts
      - name: Validate five-file approved distribution
        run: node tools/validate_public_demo_dist.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload public-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public-demo-dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
