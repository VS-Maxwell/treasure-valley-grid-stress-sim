<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explore Treasure Valley grid, water, land, load, and risk evidence in an interactive Earth-state screening model.">
  <title>Treasure Valley Earth-State Watchdog — Grid, Water, Land &amp; Risk</title>
  <link rel="stylesheet" href="watchdog.css">
  <style>
    html,body{height:100%;margin:0;background:#07101a;overflow:hidden}
    #simulator{width:100%;height:100%;border:0;display:block;background:#07101a}
    .shell-loading{position:fixed;inset:0;display:grid;place-items:center;color:#86dfff;font:600 14px system-ui;background:#07101a;z-index:2}
    .shell-loading.done{display:none}
  </style>
</head>
<body>
  <div class="shell-loading" id="shell-loading" role="status">Loading the Treasure Valley model…</div>
  <iframe id="simulator" title="Treasure Valley interactive Earth-state simulator" allow="fullscreen; webgl" loading="eager"></iframe>
  <script>
    const frame=document.getElementById('simulator');
    frame.addEventListener('load',function(){document.getElementById('shell-loading').classList.add('done')});
    fetch('legacy.html').then(function(r){if(!r.ok)throw new Error('Legacy model unavailable');return r.text()}).then(function(html){
      html=html.replace(/<script>\s*window\.addEventListener\('error',[\s\S]*?<\/script>\s*(?=<meta charset)/,'');
      html=html.replaceAll('INL RAVEN Probabilistic Risk Output','RAVEN-STYLE SCREENING · UNVALIDATED');
      html=html.replace('<head>','<head><base href="./">');
      frame.srcdoc=html;
    }).catch(function(){document.getElementById('shell-loading').textContent='The simulator could not be loaded. Please refresh.'});
  </script>
  <script src="watchdog.js"></script>
</body>
</html>
