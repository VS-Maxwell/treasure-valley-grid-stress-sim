# Build the Vite cockpit and deploy only the compiled dist/ output to Pages.
#
# The previous version of this workflow uploaded the entire repository as
# static content, so GitHub Pages served the old single-file `index.html` +
# `watchdog.js` + `legacy.html` iframe shell instead of the modular
# application. That shell loaded a multi-megabyte legacy document into a
# hidden iframe via `srcdoc`, which is the confirmed cause of the entry
# screen freeze (see docs/CRASH_INVESTIGATION.md). Those files have been
# removed; this workflow now builds app/ with Vite and publishes dist/ only.
name: Deploy Treasure Valley cockpit to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Validate release-only distribution
        run: npm run validate:dist
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dist/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
